<svg width="100%" viewBox="0 0 680 240" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Michael Kirby — GitHub Banner</title>
  <defs>
    <linearGradient id="bggrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050A18"/>
      <stop offset="100%" stop-color="#02050E"/>
    </linearGradient>
    <linearGradient id="blueStreak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00D4FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </linearGradient>
     <!-- Vertical Laser Scan def -->
    <linearGradient id="laserScan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00D4FF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </linearGradient>
  </defs>


<svg width="680" height="240" viewBox="0 0 680 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rainFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00D4FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect width="680" height="240" fill="#02050E"/>

  <g font-family="monospace" font-size="10" fill="url(#rainFade)">
    
    <text x="20" y="-100">
      <tspan x="20" dy="1.2em">1</tspan>
      <tspan x="20" dy="1.2em">0</tspan>
      <tspan x="20" dy="1.2em">0</tspan>
      <tspan x="20" dy="1.2em">1</tspan>
      <tspan x="20" dy="1.2em">1</tspan>
      <tspan x="20" dy="1.2em">0</tspan>
      <tspan x="20" dy="1.2em">1</tspan>
      <tspan x="20" dy="1.2em">1</tspan>
      <animate attributeName="y" values="-150;340" dur="4s" repeatCount="indefinite" />
    </text>

    <text x="80" y="-100">
      <tspan x="80" dy="1.2em">0</tspan>
      <tspan x="80" dy="1.2em">1</tspan>
      <tspan x="80" dy="1.2em">1</tspan>
      <tspan x="80" dy="1.2em">0</tspan>
      <tspan x="80" dy="1.2em">0</tspan>
      <tspan x="80" dy="1.2em">1</tspan>
      <tspan x="80" dy="1.2em">0</tspan>
      <tspan x="80" dy="1.2em">0</tspan>
      <animate attributeName="y" values="-200;340" dur="6s" repeatCount="indefinite" />
    </text>

    <text x="140" y="-100">
      <tspan x="140" dy="1.2em">1</tspan>
      <tspan x="140" dy="1.2em">1</tspan>
      <tspan x="140" dy="1.2em">0</tspan>
      <tspan x="140" dy="1.2em">1</tspan>
      <tspan x="140" dy="1.2em">0</tspan>
      <tspan x="140" dy="1.2em">0</tspan>
      <tspan x="140" dy="1.2em">1</tspan>
      <tspan x="140" dy="1.2em">0</tspan>
      <animate attributeName="y" values="-100;340" dur="3s" repeatCount="indefinite" />
    </text>

    <text x="340" y="-100">
      <tspan x="340" dy="1.2em">1</tspan>
      <tspan x="340" dy="1.2em">0</tspan>
      <tspan x="340" dy="1.2em">1</tspan>
      <tspan x="340" dy="1.2em">1</tspan>
      <tspan x="340" dy="1.2em">0</tspan>
      <tspan x="340" dy="1.2em">0</tspan>
      <tspan x="340" dy="1.2em">0</tspan>
      <tspan x="340" dy="1.2em">0</tspan>
      <animate attributeName="y" values="-250;340" dur="7s" repeatCount="indefinite" />
    </text>

    <text x="500" y="-100">
      <tspan x="500" dy="1.2em">0</tspan>
      <tspan x="500" dy="1.2em">0</tspan>
      <tspan x="500" dy="1.2em">1</tspan>
      <tspan x="500" dy="1.2em">0</tspan>
      <tspan x="500" dy="1.2em">1</tspan>
      <animate attributeName="y" values="-180;340" dur="5s" repeatCount="indefinite" />
    </text>
    
    <text x="620" y="-100">
      <tspan x="620" dy="1.2em">1</tspan>
      <tspan x="620" dy="1.2em">1</tspan>
      <tspan x="620" dy="1.2em">0</tspan>
      <tspan x="620" dy="1.2em">1</tspan>
      <tspan x="620" dy="1.2em">1</tspan>
      <tspan x="620" dy="1.2em">1</tspan>
      <tspan x="620" dy="1.2em">1</tspan>
      <tspan x="620" dy="1.2em">1</tspan>
      <animate attributeName="y" values="-120;340" dur="4.5s" repeatCount="indefinite" />
    </text>
  </g>
</svg>


  <!-- background
  <rect width="680" height="240" fill="url(#bggrad)" rx="10"/>

  Grid Background
  <g opacity="0.1" stroke="#00D4FF" stroke-width="0.5">
    <path d="M0 40h680M0 80h680M0 120h680M0 160h680M0 200h680"/>
    <path d="M40 0v240M80 0v240M120 0v240M160 0v240M200 0v240M240 0v240M280 0v240M320 0v240M360 0v240M400 0v240M440 0v240M480 0v240M520 0v240M560 0v240M600 0v240M640 0v240"/>
  </g> -->




  <!-- Terminal Style Borders -->
  <text x="20" y="25" font-family="monospace" font-size="10" fill="#00D4FF" opacity="0.6">[ SYSTEM_ACCESS: STABLE ]</text>
  <text x="540" y="25" font-family="monospace" font-size="10" fill="#00D4FF" opacity="0.6">LOC: GREATER_CHI</text>
  
  <!-- Name: MICHAEL KIRBY (Pixel Style) -->
  <g fill="#FFFFFF" font-family="monospace" font-weight="bold" text-anchor="middle">
    <text x="340" y="115" font-size="42" letter-spacing="8">MICHAEL KIRBY</text>
    <text x="340" y="150" font-size="14" fill="#00D4FF" letter-spacing="4" opacity="0.9">BLUE TEAM PROFESSIONAL</text>
  </g>

  <!-- Security Badge Symbols -->
  <text x="340" y="185" text-anchor="middle" font-family="monospace" font-size="11" fill="#FFFFFF" opacity="0.7">
    SEC+ | NET+ | CySA+ | CSAP
  </text>

  <!-- Animated Terminal Cursor
  <rect x="525" y="138" width="10" height="2" fill="#00D4FF">
    <animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite"/>
  </rect>
 -->

  <!-- Bottom Left CLI -->
  <text x="20" y="225" font-family="monospace" font-size="10" fill="#00D4FF" opacity="0.6">root@m-kirby:~$ tail -f /var/log/security</text>

<!-- Cursor for CLI -->
  <rect x="246" y="215" width="5" height="10" fill="#00D4FF" opacity="0.6">
     <animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite" />
  </rect>

  <!-- >flashing status: monitoring logs -->
  <text x="460" y="225" font-family="monospace" font-size="11" fill="#00D4FF" opacity="0.7">
    &gt; status: monitoring_logs_
    <animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite" />
  </text>


<rect width="680" height="60" fill="url(#laserScan)">
    <animate 
      attributeName="y" 
      values="-60; 240; 300; 240; -60; -60" 
      dur="8s" 
      keyTimes="0; 0.45; 0.5; 0.55; 0.95; 1"
      repeatCount="indefinite" />
  </rect>

  <rect x="0" y="0" width="680" height="2" fill="url(#blueStreak)">
    <animate 
      attributeName="y" 
      values="0; 240; 240; 240; 0; 0" 
      dur="8s" 
      keyTimes="0; 0.45; 0.5; 0.55; 0.95; 1"
      repeatCount="indefinite"/>
  </rect>



</svg>
